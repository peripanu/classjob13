<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 1인 1역 도장판</title>
    <meta name="description" content="학생이 자신의 1인 1역을 확인하고 수행 기록을 남기는 학급용 도장판입니다.">
    <meta property="og:title" content="우리 반 1인 1역 도장판">
    <meta property="og:description" content="오늘의 학급 역할을 확인하고 수행 도장을 찍어요.">
    <meta property="og:type" content="website">
    <!-- GitHub Pages에서는 응답 헤더를 직접 설정할 수 없어, 브라우저가 지원하는 범위에서만 보완합니다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Font (Noto Sans KR & Noto Color Emoji) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }
        .emoji-font {
            font-family: 'Noto Color Emoji', 'Segoe UI Emoji', 'Apple Color Emoji', 'Segoe UI Symbol', sans-serif !important;
            display: inline-block;
            line-height: 1;
        }
        .scrollbar-thin::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_ROLES = [
            { id: 'r1', title: '🧹 청소 도우미', desc: '쉬는 시간 및 하교 전 바닥 청소와 정리를 담당합니다.', icon: 'fa-broom', color: 'bg-emerald-500', checklist: ['책상 위 먼지 쓸기', '바닥 쓰레기 줍기', '청소도구함 정리'] },
            { id: 'r2', title: '💡 환기 및 조명', desc: '쾌적한 교실 환경을 위해 환기와 전등을 관리합니다.', icon: 'fa-wind', color: 'bg-sky-500', checklist: ['중간 쉬는 시간 창문 열기', '하교 전 창문 닫기', '이동수업 시 전등 끄기'] },
            { id: 'r3', title: '📚 학급 문고 정리', desc: '학급 문고 책장 정리와 도서 대여를 관리합니다.', icon: 'fa-book', color: 'bg-indigo-500', checklist: ['삐져나온 책 가지런히 정리', '도서 분류 맞춰 꽂기'] },
            { id: 'r4', title: '💻 정보 및 ICT', desc: 'TV 및 컴퓨터, 칠판 도우미 역할을 담당합니다.', icon: 'fa-desktop', color: 'bg-purple-500', checklist: ['수업 전 TV 리모컨 준비', '쉬는 시간 칠판 깔끔하게 지우기'] },
            { id: 'r5', title: '🌱 학급 식물 가꾸기', desc: '교실 화분에 물을 주고 상태를 확인합니다.', icon: 'fa-seedling', color: 'bg-amber-500', checklist: ['화분 흙 상태 확인하기', '필요 시 물 주기', '시든 잎 정리하기'] }
        ];

        const Avatar = ({ emoji, className = "text-2xl" }) => (
            <span className={`emoji-font align-middle ${className}`}>
                {emoji}
            </span>
        );

        const DEFAULT_STUDENTS = Array.from({ length: 15 }, (_, i) => {
            const num = i + 1;
            const avatars = ['🐶', '🐱', '🦊', '🐰', '🐼', '🐯', '🐨', '🦁', '🐥', '🦄', '🐻', '🐸', '🐹', '🤖', '🚀'];
            const roleIds = ['r1', 'r2', 'r3', 'r4', 'r5'];
            return {
                id: num,
                number: num,
                roleId: roleIds[i % roleIds.length],
                avatar: avatars[i % avatars.length]
            };
        });

        const getTodayStr = () => new Date().toISOString().split('T')[0];

        const getWeekDays = (baseDateStr) => {
            const base = new Date(baseDateStr);
            const dayOfWeek = base.getDay();
            const distanceToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
            const mon = new Date(base);
            mon.setDate(base.getDate() + distanceToMon);

            const weekDays = [];
            const dayNames = ['월', '화', '수', '목', '금'];
            for (let i = 0; i < 5; i++) {
                const d = new Date(mon);
                d.setDate(mon.getDate() + i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                weekDays.push({
                    dateStr: `${yyyy}-${mm}-${dd}`,
                    dayName: dayNames[i],
                    monthDay: `${d.getMonth() + 1}/${d.getDate()}`
                });
            }
            return weekDays;
        };

        const shiftWeek = (baseStr, days) => {
            const d = new Date(baseStr);
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        };

        function App() {
            const [mode, setMode] = React.useState('student'); // 'student' | 'teacher'
            const [loggedInStudentId, setLoggedInStudentId] = React.useState(null);
            
            const [teacherPin, setTeacherPin] = React.useState(() => {
                const savedPin = localStorage.getItem('class_teacher_pin_v3');
                // 이전 버전의 공개 기본값은 관리자 비밀번호로 쓰지 않습니다.
                return savedPin === '1234' ? '' : (savedPin || '');
            });

            const [hideTeacherBtn, setHideTeacherBtn] = React.useState(() => {
                return localStorage.getItem('class_hide_teacher_btn_v3') === 'true';
            });

            const [showTeacherPinModal, setShowTeacherPinModal] = React.useState(false);
            const [teacherPinInput, setTeacherPinInput] = React.useState('');
            const [logoClickCount, setLogoClickCount] = React.useState(0);

            const [studentPins, setStudentPins] = React.useState(() => {
                const saved = localStorage.getItem('class_student_pins_v3');
                return saved ? JSON.parse(saved) : {};
            });

            const [roles, setRoles] = React.useState(() => {
                const saved = localStorage.getItem('class_roles_v3');
                return saved ? JSON.parse(saved) : DEFAULT_ROLES;
            });

            const [students, setStudents] = React.useState(() => {
                const saved = localStorage.getItem('class_students_v3');
                return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
            });

            const [records, setRecords] = React.useState(() => {
                const saved = localStorage.getItem('class_records_v3');
                return saved ? JSON.parse(saved) : {};
            });

            const [currentDate, setCurrentDate] = React.useState(getTodayStr());
            const [toastMessage, setToastMessage] = React.useState('');
            const [alertModal, setAlertModal] = React.useState({ show: false, message: '' });
            const [showPrivacyModal, setShowPrivacyModal] = React.useState(false);

            React.useEffect(() => {
                localStorage.setItem('class_teacher_pin_v3', teacherPin);
            }, [teacherPin]);

            React.useEffect(() => {
                localStorage.setItem('class_hide_teacher_btn_v3', String(hideTeacherBtn));
            }, [hideTeacherBtn]);

            React.useEffect(() => {
                localStorage.setItem('class_student_pins_v3', JSON.stringify(studentPins));
            }, [studentPins]);

            React.useEffect(() => {
                localStorage.setItem('class_roles_v3', JSON.stringify(roles));
            }, [roles]);

            React.useEffect(() => {
                localStorage.setItem('class_students_v3', JSON.stringify(students));
            }, [students]);

            React.useEffect(() => {
                localStorage.setItem('class_records_v3', JSON.stringify(records));
            }, [records]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const showAlert = (msg) => {
                setAlertModal({ show: true, message: msg });
            };

            const handleCheckIn = (sId, targetStatus, targetDate = currentDate) => {
                setRecords(prev => {
                    const dateRecords = prev[targetDate] ? { ...prev[targetDate] } : {};
                    if (targetStatus) {
                        dateRecords[sId] = true;
                    } else {
                        delete dateRecords[sId];
                    }
                    return {
                        ...prev,
                        [targetDate]: dateRecords
                    };
                });

                if (targetStatus) {
                    if (targetDate === currentDate) {
                        showToast('🎉 오늘의 1인 1역을 훌륭히 완수했습니다!');
                        if (typeof confetti === 'function') {
                            confetti({
                                particleCount: 130,
                                spread: 90,
                                origin: { y: 0.6 }
                            });
                        }
                    } else {
                        showToast(`🎉 ${targetDate} 수행이 완료 처리되었습니다.`);
                    }
                } else {
                    showToast('수행 체크가 취소되었습니다.');
                }
            };

            const handleLogoClick = () => {
                const nextCount = logoClickCount + 1;
                setLogoClickCount(nextCount);
                if (nextCount >= 5) {
                    setLogoClickCount(0);
                    setShowTeacherPinModal(true);
                }
            };

            const verifyTeacherPin = () => {
                if (!teacherPin) {
                    if (teacherPinInput.length < 8) {
                        showAlert('처음 설정하는 교사 비밀번호는 8자 이상으로 입력해 주세요. 학생에게 링크를 공유하기 전에 교사가 먼저 설정해야 합니다.');
                        return;
                    }
                    setTeacherPin(teacherPinInput);
                    setShowTeacherPinModal(false);
                    setTeacherPinInput('');
                    setMode('teacher');
                    showToast('🔐 교사 비밀번호가 설정되었습니다.');
                    return;
                }
                if (teacherPinInput === teacherPin) {
                    setShowTeacherPinModal(false);
                    setTeacherPinInput('');
                    setMode('teacher');
                    showToast('🔓 교사 관리자 모드로 전환되었습니다.');
                } else {
                    showAlert('교사 비밀번호가 올바르지 않습니다.');
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-6">
                    {/* Header */}
                    <header className="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-slate-100 flex items-center justify-between mb-6">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={handleLogoClick}>
                            <div className="w-12 h-12 bg-emerald-500 text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-md shadow-emerald-200">
                                1/1
                            </div>
                            <div>
                                <h1 className="text-base sm:text-lg font-black text-slate-800 flex items-center gap-2">
                                    <span>우리 반 1인 1역 도장판</span>
                                    <span className="text-[11px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                                        {mode === 'teacher' ? '교사 관리자 모드' : (loggedInStudentId ? `${loggedInStudentId}번 학생 화면` : '학생 접속 관문')}
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400 font-medium">오늘 내 역할을 확인하고 도장을 찍어요!</p>
                            </div>
                        </div>

                        <div>
                            {mode === 'teacher' ? (
                                <button 
                                    onClick={() => setMode('student')}
                                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-2xl transition-all flex items-center space-x-1.5"
                                >
                                    <i className="fa-solid fa-graduation-cap"></i>
                                    <span>학생 모드로 나가기</span>
                                </button>
                            ) : (
                                !hideTeacherBtn && (
                                    <button 
                                        onClick={() => setShowTeacherPinModal(true)}
                                        className="px-3.5 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold text-xs rounded-2xl border border-amber-200 transition-all flex items-center space-x-1"
                                    >
                                        <i className="fa-solid fa-user-shield"></i>
                                        <span className="hidden sm:inline">교사 관리 모드</span>
                                    </button>
                                )
                            )}
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900/90 text-white px-5 py-3 rounded-2xl shadow-xl font-bold text-xs backdrop-blur-md animate-bounce flex items-center space-x-2">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Alert Modal */}
                    {alertModal.show && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center">
                                <div className="w-12 h-12 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                                    <i className="fa-solid fa-circle-exclamation"></i>
                                </div>
                                <h3 className="text-sm font-bold text-slate-800 mb-4">{alertModal.message}</h3>
                                <button 
                                    onClick={() => setAlertModal({ show: false, message: '' })}
                                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl"
                                >
                                    확인
                                </button>
                            </div>
                        </div>
                    )}

                    {showPrivacyModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl max-h-[85vh] overflow-y-auto">
                                <div className="flex items-start justify-between gap-4 mb-4">
                                    <div>
                                        <h2 id="privacy-title" className="text-lg font-bold text-slate-800">개인정보처리방침</h2>
                                        <p className="text-xs text-slate-500 mt-1">시행일: 2026년 8월 15일</p>
                                    </div>
                                    <button onClick={() => setShowPrivacyModal(false)} className="text-slate-500 hover:text-slate-800" aria-label="개인정보처리방침 닫기">✕</button>
                                </div>
                                <div className="space-y-4 text-xs leading-relaxed text-slate-600">
                                    <p><b>1. 무엇을 저장하나요?</b><br />이 앱은 학생의 이름을 입력받지 않습니다. 학급 운영을 위해 학생 번호, 선택한 아바타, 역할, 학생·교사 비밀번호, 역할 수행 여부와 날짜를 이 기기의 브라우저 저장소(localStorage)에 저장합니다.</p>
                                    <p><b>2. 왜, 얼마나 오래 저장하나요?</b><br />역할 배정·수행 확인과 교사 관리 기능을 제공하기 위해서만 사용합니다. 데이터는 교사가 학생·기록을 삭제하거나 이 브라우저의 사이트 데이터를 지울 때까지 해당 기기에 남습니다.</p>
                                    <p><b>3. 외부 전송과 제공</b><br />앱의 학생 번호·수행 기록은 별도 서버나 AI 서비스로 전송하지 않으며, 제3자에게 제공하지 않습니다. 다만 화면을 표시하기 위해 Google Fonts 및 Tailwind·React 등 공개 CDN에 연결될 수 있고, 이 과정에서 접속 기기의 IP 주소 등 통신 정보는 각 제공자의 정책에 따라 처리될 수 있습니다.</p>
                                    <p><b>4. 안전하게 사용하기</b><br />공용 기기에서는 사용 후 브라우저를 종료하고, 교사는 충분히 긴 관리자 비밀번호를 사용하세요. 이 앱의 비밀번호와 기록은 브라우저에만 저장되므로 다른 사람이 같은 브라우저 프로필을 쓰지 않도록 관리해야 합니다.</p>
                                    <p><b>5. 열람·정정·삭제</b><br />교사는 관리자 화면에서 학생과 역할을 수정·삭제하고, 수행 기록을 바꿀 수 있습니다. 전체 삭제는 브라우저 설정에서 이 사이트의 저장 데이터를 지우면 됩니다. 학생 또는 보호자는 담임교사에게 요청할 수 있습니다.</p>
                                    <p><b>6. 아동 보호와 문의</b><br />14세 미만 학생의 정보를 필요 이상 입력하지 마세요. 개인정보 관련 문의와 삭제 요청은 이 앱을 운영하는 담임교사 또는 학교 개인정보 보호책임자에게 해 주세요.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Teacher PIN Modal */}
                    {showTeacherPinModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100">
                                <div className="text-center mb-4">
                                    <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-800">{teacherPin ? '교사 관리자 비밀번호' : '교사 비밀번호 처음 설정'}</h3>
                                    <p className="text-xs text-slate-500 mt-1">{teacherPin ? '비밀번호를 입력하여 관리 모드로 진입합니다.' : '학생에게 공유하기 전에 교사가 8자 이상으로 먼저 설정해 주세요.'}</p>
                                </div>
                                <input 
                                    type="password" 
                                    value={teacherPinInput}
                                    onChange={(e) => setTeacherPinInput(e.target.value)}
                                    placeholder={teacherPin ? "교사 비밀번호" : "8자 이상 새 비밀번호"}
                                    className="w-full text-center text-2xl tracking-widest font-bold py-3 border border-slate-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500 mb-4"
                                    maxLength={64}
                                    autoFocus
                                    onKeyDown={(e) => e.key === 'Enter' && verifyTeacherPin()}
                                />
                                <div className="flex space-x-2">
                                    <button 
                                        onClick={() => setShowTeacherPinModal(false)}
                                        className="w-1/2 py-2.5 rounded-xl border border-slate-200 font-bold text-xs text-slate-600 hover:bg-slate-50"
                                    >
                                        취소
                                    </button>
                                    <button 
                                        onClick={verifyTeacherPin}
                                        className="w-1/2 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs"
                                    >
                                        로그인
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* View Switcher */}
                    {mode === 'teacher' ? (
                        <TeacherView 
                            students={students}
                            setStudents={setStudents}
                            roles={roles}
                            setRoles={setRoles}
                            records={records}
                            handleCheckIn={handleCheckIn}
                            currentDate={currentDate}
                            setCurrentDate={setCurrentDate}
                            showToast={showToast}
                            showAlert={showAlert}
                            teacherPin={teacherPin}
                            setTeacherPin={setTeacherPin}

                            setHideTeacherBtn={setHideTeacherBtn}

        function StudentLoginGate({ students, studentPins, setStudentPins, setLoggedInStudentId, records, currentDate, showToast, showAlert }) {
            const [selectedStForAuth, setSelectedStForAuth] = React.useState(null);
            const [pinInput, setPinInput] = React.useState('');

            const handleSelectNumber = (st) => {
                setSelectedStForAuth(st);
                setPinInput('');
            };

            const handleAuthenticate = () => {
                if (!selectedStForAuth) return;

                const existingPin = studentPins[selectedStForAuth.id];

                if (!existingPin) {
                    if (pinInput.trim().length < 2) {
                        showAlert('비밀번호는 최소 2자리 이상으로 입력해 주세요.');
                        return;
                    }
                    setStudentPins(prev => ({
                        ...prev,
                        [selectedStForAuth.id]: pinInput.trim()
                    }));
                    showToast(`🔒 ${selectedStForAuth.number}번 학생의 전용 비밀번호가 설정되었습니다!`);
                    setLoggedInStudentId(selectedStForAuth.id);
                    setSelectedStForAuth(null);
                } else {
                    if (pinInput.trim() === existingPin) {
                        showToast(`👋 환영합니다, ${selectedStForAuth.number}번 학생!`);
                        setLoggedInStudentId(selectedStForAuth.id);
                        setSelectedStForAuth(null);
                    } else {
                        showAlert('비밀번호가 올바르지 않습니다.');
                    }
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-3xl p-6 shadow-md text-center">

                        <h2 className="text-xl font-black mb-1">우리 반 학생 접속 관문</h2>
                        <p className="text-xs text-emerald-100 font-medium">
                            본인의 번호를 선택하고 비밀번호를 입력하여 전용 도장판으로 들어가세요.
                        </p>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                        <h3 className="text-sm font-bold text-slate-700 mb-4 flex items-center space-x-2">
                            <i className="fa-solid fa-users text-emerald-500"></i>
                            <span>내 번호를 선택하세요:</span>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                            {students.map((st) => {
                                const hasPin = !!studentPins[st.id];
                                const isDoneToday = !!(records[currentDate] && records[currentDate][st.id]);

                                return (
                                    <button
                                        key={st.id}
                                        onClick={() => handleSelectNumber(st)}
                                        className="bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 rounded-2xl p-4 text-center transition-all transform hover:-translate-y-1 hover:shadow-md flex flex-col items-center justify-between relative group"
                                    >
                                        <div className="mb-1 group-hover:scale-110 transition-transform">
                                            <Avatar emoji={st.avatar} className="text-3xl" />
                                        </div>
                                        <span className="font-black text-sm text-slate-800">{st.number}번 학생</span>

                                        <div className="mt-2 flex items-center space-x-1">
                                            {isDoneToday ? (
                                                <span className="text-[10px] bg-emerald-500 text-white font-bold px-2 py-0.5 rounded-full">
                                                    도장 찍음 💮
                                                </span>
                                            ) : (

                    </div>

                    {selectedStForAuth && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">

        function StudentDashboard({ studentId, setLoggedInStudentId, students, roles, records, currentDate, handleCheckIn, studentPins, setStudentPins, showToast }) {

        function TeacherView({ students, setStudents, roles, setRoles, records, handleCheckIn, currentDate, setCurrentDate, showToast, showAlert, teacherPin, setTeacherPin, hideTeacherBtn, setHideTeacherBtn, studentPins, setStudentPins }) {
            const [activeTab, setActiveTab] = React.useState('status'); // 'status' | 'weekly' | 'manage_students' | 'manage_roles' | 'share' | 'settings'
            const [weekBaseDate, setWeekBaseDate] = React.useState(currentDate);

            const [newRoleTitle, setNewRoleTitle] = React.useState('');
            const [newRoleDesc, setNewRoleDesc] = React.useState('');
            const [newRoleChecklist, setNewRoleChecklist] = React.useState('');

            const [newStudentNumber, setNewStudentNumber] = React.useState(students.length + 1);
            const [pinEdit, setPinEdit] = React.useState(teacherPin);

            const handleResetStudentPin = (sId) => {
                const newPins = { ...studentPins };
                delete newPins[sId];
                setStudentPins(newPins);
                showToast(`${sId}번 학생의 비밀번호가 해제(초기화)되었습니다.`);
            };

            const copyMainUrl = () => {
                const mainUrl = window.location.href.split('?')[0];

                if (window.location.protocol === 'file:' || mainUrl.startsWith('blob:') || mainUrl.includes('about:')) {
                    showAlert('현재 화면은 미리보기(로컬) 환경이므로 타인이 접속 가능한 웹 주소가 없습니다. 아래 [온라인 웹 링크 만드는 방법] 안내를 참고해 주세요!');
                    return;
                }

                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = mainUrl;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);

                showToast(`📋 학급 공통 링크가 복사되었습니다!`);
            };

            const handleAddRole = (e) => {
                e.preventDefault();
                if (!newRoleTitle.trim()) return;
                const newRole = {
                    id: 'r_' + Date.now(),
                    title: newRoleTitle,
                    desc: newRoleDesc,
                    icon: 'fa-star',
                    color: 'bg-indigo-500',
                    checklist: newRoleChecklist.split('\n').filter(t => t.trim().length > 0)
                };
                setRoles([...roles, newRole]);
                setNewRoleTitle('');
                setNewRoleDesc('');
                setNewRoleChecklist('');
                showToast('새 1인 1역 항목이 추가되었습니다.');
            };

            const handleDeleteRole = (id) => {
                setRoles(roles.filter(r => r.id !== id));
                setStudents(students.map(s => s.roleId === id ? { ...s, roleId: null } : s));
                showToast('역할이 삭제되었습니다.');
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                const num = Number(newStudentNumber);
                if (!num || num <= 0) return;

                if (students.some(s => s.number === num)) {
                    showAlert(`${num}번 학생은 이미 존재합니다.`);
                    return;
                }

                const avatars = ['🐶', '🐱', '🦊', '🐰', '🐼', '🐯', '🐨', '🦁', '🐥', '🦄'];
                const newSt = {
                    id: num,
                    number: num,
                    roleId: roles[0]?.id || null,
                    avatar: avatars[Math.floor(Math.random() * avatars.length)]
                };
                setStudents([...students, newSt].sort((a,b) => a.number - b.number));
                setNewStudentNumber(students.length + 2);
                showToast(`${num}번 학생이 새로 추가되었습니다.`);
            };

            const handleDeleteStudent = (id) => {
                setStudents(students.filter(s => s.id !== id));
                showToast('학생이 삭제되었습니다.');
            };

            const handleRandomAssign = () => {
                if (roles.length === 0) {
                    showAlert('등록된 역할 항목이 없습니다.');
                    return;
                }
                const shuffledRoles = [...roles].sort(() => Math.random() - 0.5);
                const updatedStudents = students.map((s, idx) => ({
                    ...s,
                    roleId: shuffledRoles[idx % shuffledRoles.length].id
                }));
                setStudents(updatedStudents);
                showToast('🎲 전체 역할이 랜덤 배정되었습니다!');
            };

            const handleSavePin = (e) => {
                e.preventDefault();
                if (!pinEdit.trim()) return;
                setTeacherPin(pinEdit.trim());
                showToast('🔒 교사 비밀번호가 변경되었습니다.');
            };

            return (
                <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    {/* Navigation Tabs */}
                    <div className="flex flex-wrap border-b border-slate-100 mb-6 gap-2 sm:gap-4">
                        <button
                            onClick={() => setActiveTab('status')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'status' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-chart-pie"></i>
                            <span>오늘의 점검</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('weekly')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'weekly' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-calendar-week"></i>
                            <span>주간 점검표</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('manage_students')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'manage_students' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-user-gear"></i>
                            <span>학생 번호 & 역할 배정</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('manage_roles')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'manage_roles' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-list-check"></i>
                            <span>역할 항목 설정</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('share')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'share' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-share-nodes"></i>
                            <span>학급 공유 링크</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('settings')}
                            className={`pb-3 font-bold text-xs sm:text-sm border-b-2 transition-all flex items-center space-x-1.5 ${
                                activeTab === 'settings' 
                                ? 'border-amber-500 text-amber-600' 
                                : 'border-transparent text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i className="fa-solid fa-shield-halved"></i>
                            <span>보안 및 비밀 설정</span>
                        </button>
                    </div>

                    {/* Tab 1: Today's Status */}
                    {activeTab === 'status' && (
                        <div className="space-y-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-amber-50 p-4 rounded-2xl border border-amber-100 gap-3">
                                <div>
                                    <h3 className="font-bold text-amber-900 text-xs sm:text-sm">직권 완료 체크 및 일자별 조망</h3>
                                    <p className="text-[11px] text-amber-700">학생 대신 수행 여부를 변경할 수 있습니다.</p>
                                </div>
                                <div>
                                    <input 
                                        type="date" 
                                        value={currentDate} 
                                        onChange={(e) => setCurrentDate(e.target.value)}
                                        className="px-3 py-1.5 bg-white rounded-xl border border-amber-200 text-xs font-bold text-slate-700 focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                {students.map((st) => {
                                    const r = roles.find(role => role.id === st.roleId);
                                    const isDone = !!(records[currentDate] && records[currentDate][st.id]);
                                    return (
                                        <div key={st.id} className="p-4 rounded-2xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                                            <div className="flex items-center space-x-3">
                                                <Avatar emoji={st.avatar} className="text-2xl" />
                                                <div>
                                                    <span className="font-bold text-slate-800 text-xs block">{st.number}번 학생</span>
                                                    <span className="text-[11px] text-emerald-600 font-medium">{r?.title || '미배정'}</span>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => handleCheckIn(st.id, !isDone)}
                                                className={`px-3 py-1.5 rounded-xl font-bold text-xs transition-all ${
                                                    isDone 
                                                    ? 'bg-emerald-500 text-white hover:bg-emerald-600' 
                                                    : 'bg-white border border-slate-200 text-slate-400 hover:text-emerald-600'
                                                }`}
                                            >
                                                {isDone ? '수행 완료 ✓' : '미수행'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Tab 2: Weekly View */}
                    {activeTab === 'weekly' && (
                        <div className="space-y-6">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 p-4 rounded-2xl border border-slate-100 gap-3">
                                <div>
                                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">주간 1인 1역 수행 출석표 (월~금)</h3>
                                    <p className="text-[11px] text-slate-500">날짜별 버튼을 클릭하여 즉시 수행 여부를 체크할 수 있습니다.</p>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button 
                                        onClick={() => setWeekBaseDate(prev => shiftWeek(prev, -7))}
                                        className="px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100"
                                    >
                                        <i className="fa-solid fa-chevron-left mr-1"></i> 지난주
                                    </button>
                                    <button 
                                        onClick={() => setWeekBaseDate(getTodayStr())}
                                        className="px-3 py-1.5 bg-amber-500 text-white rounded-xl text-xs font-bold hover:bg-amber-600"
                                    >
                                        이번주
                                    </button>
                                    <button 
                                        onClick={() => setWeekBaseDate(prev => shiftWeek(prev, 7))}
                                        className="px-2.5 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100"
                                    >
                                        다음주 <i className="fa-solid fa-chevron-right ml-1"></i>
                                    </button>
                                </div>
                            </div>

                            <div className="overflow-x-auto scrollbar-thin">
                                <table className="w-full text-center text-xs">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                            <th className="p-3 text-left w-24">학생</th>
                                            <th className="p-3 text-left">담당 역할</th>
                                            {getWeekDays(weekBaseDate).map(w => (
                                                <th key={w.dateStr} className={`p-3 min-w-[75px] ${w.dateStr === currentDate ? 'bg-amber-100 text-amber-900 rounded-t-xl' : ''}`}>
                                                    <div>{w.dayName}</div>
                                                    <div className="text-[10px] font-normal text-slate-400">{w.monthDay}</div>
                                                </th>
                                            ))}
                                            <th className="p-3 w-20">주간 달성</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {students.map((st) => {
                                            const r = roles.find(role => role.id === st.roleId);
                                            const weekDays = getWeekDays(weekBaseDate);
                                            let weekDoneCount = 0;

                                            return (
                                                <tr key={st.id} className="hover:bg-slate-50/60">
                                                    <td className="p-3 text-left font-bold text-slate-800">
                                                        <span className="mr-1.5"><Avatar emoji={st.avatar} className="text-base" /></span>
                                                        <span>{st.number}번</span>
                                                    </td>
                                                    <td className="p-3 text-left font-medium text-slate-600">
                                                        {r?.title || <span className="text-slate-300 italic">미배정</span>}
                                                    </td>
                                                    {weekDays.map(w => {
                                                        const isDone = !!(records[w.dateStr] && records[w.dateStr][st.id]);
                                                        if (isDone) weekDoneCount++;
                                                        const isToday = w.dateStr === currentDate;

                                                        return (
                                                            <td key={w.dateStr} className={`p-2 ${isToday ? 'bg-amber-50/50' : ''}`}>
                                                                <button
                                                                    onClick={() => handleCheckIn(st.id, !isDone, w.dateStr)}
                                                                    className={`w-9 h-9 rounded-xl font-black text-sm transition-all flex items-center justify-center mx-auto ${
                                                                        isDone 
                                                                        ? 'bg-emerald-500 text-white shadow-xs hover:bg-emerald-600' 
                                                                        : 'bg-slate-100 text-slate-300 hover:bg-slate-200 hover:text-slate-500'
                                                                    }`}
                                                                >
                                                                    {isDone ? '💮' : '-'}
                                                                </button>
                                                            </td>
                                                        );
                                                    })}
                                                    <td className="p-3">
                                                        <span className={`font-black text-xs px-2 py-1 rounded-full ${
                                                            weekDoneCount === 5 
                                                            ? 'bg-emerald-100 text-emerald-800' 
                                                            : (weekDoneCount > 0 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-400')
                                                        }`}>
                                                            {weekDoneCount}/5
                                                        </span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Tab 3: Student & Role Assignment */}
                    {activeTab === 'manage_students' && (
                        <div className="space-y-6">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <div>
                                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">학생 번호 및 역할 자동 배정</h3>
                                    <p className="text-[11px] text-slate-500">학생 번호 관리 및 비밀번호 해제, 역할 변경이 가능합니다.</p>
                                </div>
                                <button
                                    onClick={handleRandomAssign}
                                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center space-x-1.5"
                                >
                                    <i className="fa-solid fa-dice"></i>
                                    <span>전체 역할 무작위 랜덤 배정</span>
                                </button>
                            </div>

                            <form onSubmit={handleAddStudent} className="flex gap-2 max-w-sm">
                                <input 
                                    type="number" 
                                    value={newStudentNumber}
                                    onChange={(e) => setNewStudentNumber(e.target.value)}
                                    placeholder="새 학생 번호"
                                    className="px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 w-full"
                                    min={1}
                                />
                                <button type="submit" className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shrink-0">
                                    학생 추가
                                </button>
                            </form>

                            <div className="space-y-2">
                                {students.map((st) => {
                                    const hasPin = !!studentPins[st.id];
                                    return (
                                        <div key={st.id} className="p-3 bg-white border border-slate-200 rounded-2xl flex items-center justify-between flex-wrap gap-2">
                                            <div className="flex items-center space-x-3">
                                                <Avatar emoji={st.avatar} className="text-xl" />
                                                <span className="font-black text-slate-800 text-xs">{st.number}번 학생</span>
                                            </div>

                                            <div className="flex items-center space-x-2">
                                                <select
                                                    value={st.roleId || ''}
                                                    onChange={(e) => {
                                                        const val = e.target.value;
                                                        setStudents(students.map(s => s.id === st.id ? { ...s, roleId: val || null } : s));
                                                    }}
                                                    className="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-700 focus:outline-none"
                                                >
                                                    <option value="">-- 미배정 --</option>
                                                    {roles.map(r => (
                                                        <option key={r.id} value={r.id}>{r.title}</option>
                                                    ))}
                                                </select>

                                                {hasPin ? (
                                                    <button
                                                        onClick={() => handleResetStudentPin(st.id)}
                                                        className="px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold text-[11px] rounded-xl border border-amber-200"
                                                        title="비밀번호 해제"
                                                    >
                                                        🔑 암호 초기화
                                                    </button>
                                                ) : (
                                                    <span className="text-[11px] text-slate-400 px-2 py-1">암호 없음</span>
                                                )}

                                                <button
                                                    onClick={() => handleDeleteStudent(st.id)}
                                                    className="text-slate-400 hover:text-rose-500 p-1.5 text-xs transition-colors"
                                                    title="학생 삭제"
                                                >
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Tab 4: Manage Role Items */}
                    {activeTab === 'manage_roles' && (
                        <div className="space-y-6">
                            <form onSubmit={handleAddRole} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                                <h3 className="font-bold text-slate-800 text-xs sm:text-sm">새 1인 1역 추가하기</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input 
                                        type="text" 
                                        placeholder="역할 이름 (예: 🧹 청소 도우미)"
                                        value={newRoleTitle}
                                        onChange={(e) => setNewRoleTitle(e.target.value)}
                                        className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="역할 설명"
                                        value={newRoleDesc}
                                        onChange={(e) => setNewRoleDesc(e.target.value)}
                                        className="px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none"
                                    />
                                </div>
                                <textarea
                                    placeholder="세부 지침 (줄바꿈으로 구분)"
                                    value={newRoleChecklist}
                                    onChange={(e) => setNewRoleChecklist(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none h-20"
                                ></textarea>
                                <button type="submit" className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl">
                                    역할 추가하기
                                </button>
                            </form>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {roles.map(r => (
                                    <div key={r.id} className="p-4 border border-slate-200 rounded-2xl bg-white flex flex-col justify-between space-y-2">
                                        <div>
                                            <div className="flex items-center justify-between mb-1">
                                                <h4 className="font-bold text-slate-800 text-xs">{r.title}</h4>
                                                <button onClick={() => handleDeleteRole(r.id)} className="text-slate-300 hover:text-rose-500 text-xs">
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                            <p className="text-[11px] text-slate-500 leading-relaxed">{r.desc}</p>
                                        </div>
                                        {r.checklist && r.checklist.length > 0 && (
                                            <div className="pt-2 border-t border-slate-100 text-[10px] text-slate-400">
                                                지침 {r.checklist.length}개 설정됨
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tab 5: Share Links */}
                    {activeTab === 'share' && (
                        <div className="space-y-6">
                            <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-emerald-900">
                                <h3 className="font-bold text-xs sm:text-sm mb-1">🔗 학급 학생 접속 공통 링크 복사</h3>
                                <p className="text-xs text-emerald-700 leading-relaxed mb-4">
                                    학생들에게 이 링크를 전달하면 학생들은 본인의 번호를 선택하여 각자의 비밀번호로 도장을 찍을 수 있습니다.
                                </p>
                                <button 
                                    onClick={copyMainUrl}
                                    className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm flex items-center space-x-2"
                                >
                                    <i className="fa-solid fa-copy"></i>
                                    <span>학급 공통 접속 링크 복사하기</span>
                                </button>
                            </div>

                        </div>
                    )}

                    {/* Tab 6: Settings */}
                    {activeTab === 'settings' && (
                        <div className="space-y-6 max-w-md">
                            <form onSubmit={handleSavePin} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                                <h3 className="font-bold text-slate-800 text-xs sm:text-sm">교사 관리자 비밀번호 변경</h3>
                                <p className="text-xs text-slate-500">교사 전용 관리 화면에 진입할 때 사용되는 비밀번호입니다.</p>
                                <input 
                                    type="password" 
                                    value={pinEdit}
                                    onChange={(e) => setPinEdit(e.target.value)}
                                    placeholder="새 비밀번호"
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none"
                                />
                                <button type="submit" className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl">
                                    비밀번호 저장
                                </button>
                            </form>

                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center justify-between">
                                <div>
                                    <h4 className="font-bold text-slate-800 text-xs">상단 [교사 관리 모드] 버튼 숨기기</h4>
                                    <p className="text-[11px] text-slate-500">숨김 시 우측 상단 버튼이 없어지며, 왼쪽 상단 '1/1' 로고를 5번 연속 클릭해야 암호창이 뜹니다.</p>
                                </div>
                                <input 
                                    type="checkbox" 
                                    checked={hideTeacherBtn}
                                    onChange={(e) => setHideTeacherBtn(e.target.checked)}
                                    className="w-5 h-5 accent-amber-500 cursor-pointer"
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
